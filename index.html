<!DOCTYPE html><html><head><meta charset="utf-8"><title>Juros Compostos</title><link rel="stylesheet" href="style.css"><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script></head><body><div class="card"><h2>Calculadora de Juros Compostos</h2><div class="grid">
<label>Valor inicial<input id="pv" type="number" value="1000"></label>
<label>Aporte mensal<input id="pmt" type="number" value="500"></label>
<label>Juros (% a.m.)<input id="r" type="number" step="0.01" value="1"></label>
<label>Meses<input id="n" type="number" value="120"></label></div>
<div class="results"><div>Total investido <b id="inv"></b></div><div>Juros <b id="int"></b></div><div>Patrimônio <b id="fv"></b></div></div><div id="chart"></div></div><script src="script.js"></script></body></html>
